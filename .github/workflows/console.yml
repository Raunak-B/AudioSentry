name: Console Pipeline

on:
  push:
    paths:
      - 'audiosentry-console/**'
  pull_request:
    paths:
      - 'audiosentry-console/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: audiosentry-console/frontend/package-lock.json

      - name: LFS Audit
        run: |
          echo "Verifying no React/Node JSON files are tracked in LFS..."
          LFS_FILES=$(git lfs ls-files --name-only || true)
          if echo "$LFS_FILES" | grep -E 'package\.json|package-lock\.json|vite\.config|\.eslintrc'; then
            echo "ERROR: Node/React configuration files are being tracked by Git LFS!"
            echo "This causes corrupt builds. Untrack them with 'git lfs untrack \"*.json\"'."
            exit 1
          else
            echo "LFS tracking validation passed."
          fi

      - name: Install Frontend Dependencies
        working-directory: audiosentry-console/frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: audiosentry-console/frontend
        run: npx playwright install chromium --with-deps

      - name: E2E Validation
        working-directory: audiosentry-console/frontend
        run: |
          echo "Spinning up background servers and running Playwright suite..."
          # Assuming package.json defines "test:e2e" or we invoke playwright directly
          npx playwright test

      - name: Build Frontend
        working-directory: audiosentry-console/frontend
        run: |
          echo "Building Vite React app..."
          npm run build

      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: audiosentry-console/frontend
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials for BFF
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Node BFF to AWS ECS Fargate
        working-directory: audiosentry-console/bff
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_BFF }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building and pushing BFF image to ECR..."
          docker build -t audiosentry-bff:latest .
          docker tag audiosentry-bff:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "Updating ECS service..."
          aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER_NAME }} --service ${{ secrets.ECS_SERVICE_BFF }} --force-new-deployment
