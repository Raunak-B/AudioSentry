name: Engine Pipeline

on:
  push:
    paths:
      - 'audiosentry-engine/**'
  pull_request:
    paths:
      - 'audiosentry-engine/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: audiosentry-engine
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: false # We manually pull specific LFS files

      - name: LFS Pull Weights
        run: |
          echo "Pulling specific model weights from Git LFS..."
          git lfs pull --include="weights/acoustic_head.pt,fusion_model.json"
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test & Lint
        run: |
          # Validate CRM degradation and XAI gating logic
          PYTHONPATH=. pytest tests/

      - name: Docker Build
        run: |
          echo "Building multi-stage Docker container for Engine..."
          docker build -t audiosentry-engine:latest .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to Registry
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_ENGINE }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Tagging and pushing container image to ECR..."
          docker tag audiosentry-engine:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to AWS ECS Fargate
        run: |
          echo "Updating ECS service to deploy the new image..."
          aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER_NAME }} --service ${{ secrets.ECS_SERVICE_ENGINE }} --force-new-deployment
