syntax = "proto3";

package audiosentry;

service VoiceIntegrityService {
  rpc StreamAudio(stream AudioChunk) returns (stream RiskUpdate);
  rpc AnalyzeFile(AudioFile) returns (RiskResult);
  rpc Enroll(EnrollmentRequest) returns (EnrollmentAck);
  rpc DeepScan(DeepScanRequest) returns (RiskResult);
  rpc Override(OverrideRequest) returns (OverrideAck);
}

message AudioChunk {
  string call_id = 1;
  bytes audio_data = 2;
  int64 timestamp_ms = 3;
}

message RiskUpdate {
  string call_id = 1;
  int32 risk_score = 2;
  bool layer2_triggered = 3;
  string transcript_fragment = 4; // NEW FIELD
}

message AudioFile {
  bytes audio_data = 1;
  string metadata_json = 2;
}

message EnrollmentRequest {
  string caller_id = 1;
  bytes audio_data = 2;
}

message EnrollmentAck {
  string status = 1;
  string caller_id = 2;
}

message DeepScanRequest {
  string call_id = 1;
  string metadata_json = 2;
}

message OverrideRequest {
  string call_id = 1;
  string reason = 2;
  string agent_id = 3;
}

message OverrideAck {
  string status = 1;
  string call_id = 2;
}

message RiskResult {
  int32 risk_score = 1;
  string reason = 2;
  RecommendedAction recommended_action = 3;
  bytes heatmap_png = 4; // raw PNG bytes; REST/WS encode this as base64 instead
}

enum RecommendedAction {
  APPROVE = 0;
  REQUIRE_MFA_STEPUP = 1;
  INITIATE_CALLBACK = 2;
  FREEZE_TRANSACTION_ESCALATE_SUPERVISOR = 3;
}